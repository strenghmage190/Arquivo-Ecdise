<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Terminal Ordo Realitas</title>
    <link rel="icon" type="image/webp" href="/assets/ordem/Simbolo_Transcender.webp" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <div id="root"></div>
    <script>
      // Visible error logger for mobile debugging
      window.addEventListener('error', function(e) {
        var errDiv = document.getElementById('debug-error');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'debug-error';
          errDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:red;color:white;z-index:999999;padding:10px;font-family:sans-serif;font-size:12px;overflow:auto;max-height:100%;';
          document.body.appendChild(errDiv);
        }
        errDiv.innerHTML += '<br>' + (e.message || e) + ' in ' + e.filename + ':' + e.lineno;
      });
      window.addEventListener('unhandledrejection', function(e) {
        var errDiv = document.getElementById('debug-error');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'debug-error';
          errDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:red;color:white;z-index:999999;padding:10px;font-family:sans-serif;font-size:12px;overflow:auto;max-height:100%;';
          document.body.appendChild(errDiv);
        }
        errDiv.innerHTML += '<br>Promise: ' + (e.reason ? e.reason.message || e.reason : 'unknown');
      });

      // Suppress noisy extension-injected syntax errors (e.g. webpage_content_reporter.js)
      window.addEventListener('error', function (e) {
        try {
          var fn = e.filename || (e && e.target && e.target.src) || '';
          var msg = e && e.message ? e.message : '';
          if (fn.indexOf('webpage_content_reporter.js') !== -1 || msg.indexOf("Unexpected token 'export'") !== -1 && fn) {
            e.preventDefault();
            console.warn('Suppressed extension error from', fn || msg);
          }
        } catch (err) {
          // ignore
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
