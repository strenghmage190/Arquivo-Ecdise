<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Terminal Ordo Realitas</title>
    <link rel="icon" type="image/webp" href="/assets/ordem/Simbolo_Transcender.webp" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
    <style>
      /* Loading screen — visível antes do React montar. Removido via JS após mount. */
      #root:empty::before {
        content: 'INICIALIZANDO SISTEMA...';
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050505;
        color: #b33030;
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        letter-spacing: 3px;
        text-transform: uppercase;
      }
      /* Spinner no centro */
      #root:empty::after {
        content: '';
        position: fixed;
        top: calc(50% - 30px);
        left: calc(50% - 20px);
        width: 40px;
        height: 40px;
        border: 2px solid #1a0505;
        border-top-color: #b33030;
        border-radius: 50%;
        animation: __spin 1s linear infinite;
      }
      @keyframes __spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body style="margin:0;background:#050505;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
