<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Mesa de Investigação — Caso Confidencial</title>
  <meta name="description" content="Board interativo de investigação com pistas, conexões, notas e ferramentas." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #0b0c10;
      --surface: #11141b;
      --border: #29313d;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --red: #e63946;
      --font: "JetBrains Mono", "Space Mono", monospace;
      --font-case: "Rajdhani", sans-serif;
      --header-h: 64px;
      --toolbar-h: 52px;
      --sidebar-w: 56px;
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font);
      overflow: hidden;
      user-select: none;
    }

    button {
      font-family: var(--font);
      cursor: pointer;
      border: none;
      background: transparent;
    }

    input,
    textarea,
    select {
      font-family: var(--font);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    #app {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: var(--header-h) 1fr var(--toolbar-h);
      grid-template-columns: var(--sidebar-w) 1fr;
      grid-template-areas: "hdr hdr" "side board" "tbar tbar";
    }

    #hdr {
      grid-area: hdr;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 200;
      gap: 16px;
    }

    .hdr-c {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .case-meta {
      color: var(--text-secondary);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    #case-title {
      color: var(--text-primary);
      font-family: var(--font-case);
      font-size: clamp(16px, 2vw, 26px);
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255, 255, 255, .2);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--red);
      color: var(--text-primary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      transition: background 120ms;
    }

    .btn-back:hover {
      background: rgba(139, 20, 20, .18);
    }

    #side {
      grid-area: side;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      z-index: 100;
      overflow-y: auto;
      scrollbar-width: none;
    }

    #side::-webkit-scrollbar {
      display: none;
    }

    .sdiv {
      width: 28px;
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    .tbtn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      width: 44px;
      padding: 6px 0;
      border: 1px solid transparent;
      color: var(--text-secondary);
      font-size: 7px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      transition: border-color 120ms, background 120ms, color 120ms;
    }

    .tbtn:hover,
    .tbtn.on {
      border-color: #545458;
      background: #1b1b1e;
      color: var(--text-primary);
    }

    .tbtn svg {
      width: 18px;
      height: 18px;
    }

    #bwrap {
      grid-area: board;
      position: relative;
      overflow: hidden;
      background-color: var(--bg);
      background-image: radial-gradient(ellipse at center, transparent 20%, rgba(0, 0, 0, .34) 100%), linear-gradient(rgba(148, 163, 184, .04) 1px, transparent 1px), linear-gradient(90deg, rgba(148, 163, 184, .04) 1px, transparent 1px);
      background-size: 100% 100%, 36px 36px, 36px 36px;
      cursor: grab;
      touch-action: none;
    }

    #bwrap.grabbing {
      cursor: grabbing;
    }

    #bwrap.xcursor {
      cursor: crosshair;
    }

    #blayer {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      width: 0;
      height: 0;
      overflow: visible;
    }

    #csvg {
      position: absolute;
      top: 0;
      left: 0;
      width: 20000px;
      height: 20000px;
      overflow: visible;
      pointer-events: none;
      z-index: 1;
    }

    .cline {
      pointer-events: stroke;
      cursor: pointer;
    }

    #tbar {
      grid-area: tbar;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 6px;
      background: rgba(15, 17, 23, .98);
      border-top: 1px solid var(--border);
      z-index: 200;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tg {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 6px;
    }

    .tg+.tg {
      border-left: 1px solid #45515f;
    }

    .ml {
      margin-left: auto;
    }

    .hbtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      padding: 0 10px;
      border: 1px solid transparent;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: border-color 120ms, background 120ms, color 120ms;
    }

    .hbtn:hover {
      border-color: #64748b;
      background: #1b2330;
      color: var(--text-primary);
    }

    .hbtn.on {
      border-color: #545458;
      background: #1b1b1e;
      color: var(--text-primary);
    }

    .hbtn.ic {
      width: 34px;
      padding: 0;
    }

    .hbtn:disabled {
      opacity: .35;
      pointer-events: none;
    }

    .hbtn.dng {
      color: #c45757;
    }

    .hbtn.dng:hover {
      border-color: var(--red);
      background: rgba(198, 40, 40, .12);
    }

    .zv {
      min-width: 44px;
      color: var(--text-secondary);
      font-size: 10px;
      text-align: center;
    }

    .cdot {
      width: 10px;
      height: 10px;
      border-radius: 1px;
    }

    .psw {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .psw.on {
      border-color: var(--text-primary);
    }

    .card-node {
      position: absolute;
      z-index: 10;
      width: 244px;
      min-height: 286px;
      border: 1px solid var(--border);
      background: var(--surface);
      background-image: linear-gradient(rgba(148, 163, 184, .03) 1px, transparent 1px), linear-gradient(90deg, rgba(148, 163, 184, .03) 1px, transparent 1px);
      background-size: 20px 20px;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
      cursor: grab;
      touch-action: none;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: border-color 120ms, box-shadow 120ms;
    }

    .card-node:active {
      cursor: grabbing;
    }

    .card-node:hover {
      z-index: 100;
      border-color: #64748b;
      box-shadow: 0 0 18px rgba(148, 163, 184, .12), 0 4px 12px rgba(0, 0, 0, .3);
    }

    .card-node.sel {
      outline: 1px solid var(--text-primary);
      outline-offset: 3px;
      z-index: 101;
    }

    .card-node.locked {
      border-style: dashed;
    }

    .card-node[data-status=verified] .cstamp {
      color: #4ade80;
      border-color: #4ade80;
    }

    .card-node[data-status=theory] .cstamp {
      color: #fbbf24;
      border-color: #fbbf24;
    }

    .card-node[data-status=false] {
      border-color: var(--red);
    }

    .card-node[data-status=false] .cstamp {
      color: #ff6672;
      border-color: var(--red);
    }

    @keyframes cspawn {
      from {
        opacity: 0;
        transform: scale(.92);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .card-node.new {
      animation: cspawn .4s ease-out;
    }

    .cimgw {
      position: relative;
      width: 100%;
      height: 148px;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      background: #000;
      flex-shrink: 0;
    }

    .cimgw img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: filter .3s;
    }

    .cimgw.uv img {
      filter: drop-shadow(0 0 10px #7c3aed);
    }

    .cnoimg {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e2632;
    }

    .cnoimg svg {
      width: 48px;
      height: 48px;
    }

    .cbadges {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      z-index: 10;
    }

    .cbadge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-primary);
      font-size: 11px;
    }

    .cbody {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 12px 14px;
      min-height: 80px;
    }

    .cuuid {
      color: var(--text-secondary);
      font-size: 9px;
      letter-spacing: .1em;
      margin-bottom: 4px;
    }

    .ctitle {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .045em;
      line-height: 1.35;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .cstamp {
      position: absolute;
      right: 10px;
      bottom: 10px;
      padding: 3px 5px;
      border: 2px dashed currentColor;
      color: var(--text-secondary);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .12em;
      opacity: .85;
      transform: rotate(-4deg);
      pointer-events: none;
    }

    .cbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 6px 8px;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }

    .cact {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 28px;
      border: 1px solid transparent;
      color: var(--text-secondary);
      transition: border-color 100ms, background 100ms, color 100ms;
    }

    .cact:hover,
    .cact.on {
      border-color: #545458;
      background: #1b1b1e;
      color: var(--text-primary);
    }

    .cact svg {
      width: 14px;
      height: 14px;
    }

    .csep {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 3px;
    }

    .note-node {
      position: absolute;
      z-index: 15;
      width: 200px;
      min-height: 140px;
      background: #f5e642;
      color: #1a1a1a;
      font-family: var(--font);
      font-size: 12px;
      line-height: 1.5;
      padding: 10px 12px 28px;
      box-shadow: 3px 4px 14px rgba(0, 0, 0, .4);
      cursor: grab;
      touch-action: none;
      display: flex;
      flex-direction: column;
    }

    .note-node:active {
      cursor: grabbing;
    }

    .note-node.sel {
      outline: 2px solid #f5e642;
      outline-offset: 3px;
    }

    .nhdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(0, 0, 0, .55);
    }

    .nhdr button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .12);
      color: #1a1a1a;
      font-size: 12px;
    }

    .nta {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 13px;
      color: #1a1a1a;
      line-height: 1.55;
      min-height: 80px;
    }

    .pin-node {
      position: absolute;
      z-index: 20;
      cursor: grab;
      touch-action: none;
      transform: translate(-50%, -100%);
    }

    .pin-node:active {
      cursor: grabbing;
    }

    .pcircle {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .4);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .5);
      margin: 0 auto;
    }

    .pstem {
      width: 2px;
      height: 18px;
      background: #888;
      margin: 0 auto;
    }

    #mq {
      position: absolute;
      border: 1px solid var(--text-primary);
      background: rgba(232, 232, 234, .07);
      pointer-events: none;
      z-index: 9999;
      display: none;
    }

    .moverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9000;
      backdrop-filter: blur(2px);
    }

    .mbox {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 24px;
      width: min(480px, calc(100vw - 32px));
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .6);
    }

    .mtitle {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .mrow {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .mlbl {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .minp,
    .mta,
    .msel {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 12px;
      padding: 8px 10px;
      width: 100%;
      outline: none;
      transition: border-color 120ms;
    }

    .minp:focus,
    .mta:focus,
    .msel:focus {
      border-color: #64748b;
    }

    .mta {
      resize: vertical;
      min-height: 80px;
    }

    .msel option {
      background: var(--bg);
    }

    .macts {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .mbtn {
      height: 34px;
      padding: 0 16px;
      background: #1b2330;
      border: 1px solid #64748b;
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 120ms;
    }

    .mbtn:hover {
      background: #253044;
    }

    .mbtn.cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .mbtn.cancel:hover {
      border-color: #64748b;
      color: var(--text-primary);
    }

    #ctx {
      position: fixed;
      z-index: 10000;
      background: var(--surface);
      border: 1px solid var(--border);
      min-width: 200px;
      padding: 6px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, .5);
      display: none;
      flex-direction: column;
      gap: 3px;
    }

    #ctx.on {
      display: flex;
    }

    .ctitle2 {
      padding: 4px 8px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }

    .citem {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      font-size: 11px;
      color: var(--text-primary);
      border: 1px solid transparent;
      cursor: pointer;
      transition: border-color 100ms, background 100ms;
    }

    .citem:hover {
      border-color: #545458;
      background: #1b1b1e;
    }

    .citem.dng {
      color: #c45757;
    }

    .citem svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    #insp {
      position: fixed;
      top: var(--header-h);
      right: 0;
      width: min(340px, 90vw);
      height: calc(100vh - var(--header-h) - var(--toolbar-h));
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 500;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    #insp.on {
      display: flex;
    }

    .ihdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .ihdr span {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .iimg {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      flex-shrink: 0;
    }

    .ibody {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ititle {
      font-family: var(--font-case);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .idesc {
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .ifield {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .iflbl {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .ifval {
      font-size: 12px;
    }

    #objp {
      position: fixed;
      bottom: var(--toolbar-h);
      left: var(--sidebar-w);
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: none;
      width: 220px;
      max-height: 320px;
      z-index: 400;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    #objp.on {
      display: flex;
    }

    .ophdr {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .olist {
      overflow-y: auto;
      flex: 1;
      scrollbar-width: thin;
      scrollbar-color: #29313d transparent;
    }

    .oitem {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      font-size: 11px;
      color: var(--text-primary);
      border-bottom: 1px solid rgba(41, 49, 61, .5);
      cursor: pointer;
      transition: background 100ms;
    }

    .oitem:hover {
      background: #1b2330;
    }

    .oico {
      width: 24px;
      height: 24px;
      font-size: 16px;
      text-align: center;
      line-height: 24px;
      flex-shrink: 0;
    }

    #toast {
      position: fixed;
      bottom: calc(var(--toolbar-h) + 14px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 14px;
      font-size: 11px;
      z-index: 8000;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s;
      white-space: nowrap;
    }

    #toast.on {
      opacity: 1;
    }

    #uvc {
      position: absolute;
      pointer-events: none;
      z-index: 3000;
      display: none;
    }

    #uvc div {
      position: absolute;
      transform: translate(-50%, -50%);
      border-radius: 50%;
    }

    #zi {
      position: fixed;
      top: calc(var(--header-h)+10px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 5px 12px;
      font-size: 11px;
      color: var(--text-secondary);
      z-index: 300;
      pointer-events: none;
      opacity: 0;
      transition: opacity .3s;
    }

    #zi.on {
      opacity: 1;
    }
  </style>
</head>

<body>
  <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round">

    function addCard(o) { o = o || {}; var id = uid(); cards.push({ id: id, title: o.title || 'NOVA PISTA', desc: o.desc || '', imgUrl: o.imgUrl || '', type: o.type || 'image', x: o.x != null ? o.x : 200, y: o.y != null ? o.y : 200, status: null, locked: !!o.locked }); return id; }

    function doRedo() { var a = redos.pop(); if (!a) return; if (a.type === 'add_card') { cards.push(a.card); } else if (a.type === 'del_card') { remCard(a.id); } else if (a.type === 'move') { var it = find(a.it, a.id); if (it) { it.x = a.tx; it.y = a.ty; } } else if (a.type === 'add_conn') { conns.push(a.conn); } undos.push(a); renderAll(); syncUB(); }

    function renderAll() { var layer = document.getElementById('blayer'); Array.from(layer.children).forEach(function (el) { if (el.id !== 'csvg') el.remove(); }); cards.forEach(function (c) { layer.appendChild(mkCard(c)); }); notes.forEach(function (n) { layer.appendChild(mkNote(n)); }); pins.forEach(function (p) { layer.appendChild(mkPin(p)); }); renderSVG(); }
    function renderSVG() {
